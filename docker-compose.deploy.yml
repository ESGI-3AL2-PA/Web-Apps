# Stack de production / déploiement — lance les services applicatifs à partir des
# images que la CD a poussées sur GHCR (jamais de build sur l'hôte) et place un reverse
# proxy Caddy devant tout (HTTPS automatique).
#
# C'est le SEUL compose de production : `docker-compose.yml` est le dev, celui-ci le prod.
# Les images sont l'artefact — pas de `build:` ici ; la CI build chaque app depuis
# apps/<app>/Dockerfile et la pousse vers ghcr.io/esgi-3al2-pa/web-apps/<app>. Le job de
# déploiement CD l'exécute sur la VM :
#
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d --no-build
#
# Chaque secret ET chaque URL d'environnement provient de l'env déchiffré par SOPS
# (prod.enc.env) via `sops exec-env` — rien en clair ici. Les URLs front (VITE_*) sont
# figées dans les bundles au build CI, donc PAS lues ici. L'auth-service a besoin d'une
# paire de clés RS256 STABLE (des clés éphémères tournent au redémarrage et cassent la
# vérification des JWT) : générez-la avec scripts/gen-auth-keys.sh dans ./docker/auth/ —
# montée en lecture seule plus bas.
services:
  api:
    image: ghcr.io/esgi-3al2-pa/web-apps/api:latest
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 3000
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in the SOPS env}:${MONGO_ROOT_PASSWORD:?set in the SOPS env}@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-db}
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in the SOPS env}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in the SOPS env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in the SOPS env}
      # Derrière Caddy : TRUST_PROXY est le nombre de sauts de proxy de confiance.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Stockage des messages vocaux + images d'annonces dans MinIO (buckets créés par minio-createbucket).
      MESSAGES_MINIO_ENDPOINT: http://minio:9000
      MESSAGES_MINIO_BUCKET: messages
      MESSAGES_MINIO_ACCESS_KEY: ${DOCUMENSO_S3_ACCESS_KEY:?set in the SOPS env}
      MESSAGES_MINIO_SECRET_KEY: ${DOCUMENSO_S3_SECRET_KEY:?set in the SOPS env}
      LISTINGS_MINIO_ENDPOINT: http://minio:9000
      LISTINGS_MINIO_BUCKET: listings
      LISTINGS_MINIO_ACCESS_KEY: ${DOCUMENSO_S3_ACCESS_KEY:?set in the SOPS env}
      LISTINGS_MINIO_SECRET_KEY: ${DOCUMENSO_S3_SECRET_KEY:?set in the SOPS env}
      # Documenso joignable sur le réseau interne ; secrets issus de l'env SOPS (créés une fois via l'UI).
      DOCUMENSO_URL: http://documenso:3030
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_TEMPLATE_ID: ${DOCUMENSO_TEMPLATE_ID:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
      DOCUMENSO_SIGNING_LANGUAGE: ${DOCUMENSO_SIGNING_LANGUAGE:-fr}
      DOCUMENSO_DOWNLOAD_HOSTS: ${DOCUMENSO_DOWNLOAD_HOSTS:-minio:9000}
      CONTRACTS_SIGN_REDIRECT_URL: ${CONTRACTS_SIGN_REDIRECT_URL:?set in the SOPS env}
    # Attendre que les datastores soient PRÊTS, pas seulement démarrés — l'api se
    # connecte à Mongo + Neo4j au boot et échoue vite sinon.
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      auth-service:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    image: ghcr.io/esgi-3al2-pa/web-apps/auth-service:latest
    restart: always
    # Clés RS256 stables (lecture seule). Générer avec scripts/gen-auth-keys.sh → ./docker/auth/.
    volumes:
      - ./docker/auth:/run/auth-keys:ro
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      # Derrière Caddy : TRUST_PROXY est le nombre de sauts de confiance, pour qu'express-rate-limit
      # se base sur la vraie IP client et non sur celle du proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in the SOPS env}:${MONGO_ROOT_PASSWORD:?set in the SOPS env}@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-db}
      API_URL: http://api:3000
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:?set in the SOPS env}
      VITE_APP_URL: ${VITE_APP_URL:?set in the SOPS env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in the SOPS env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in the SOPS env}
      AUTH_PRIVATE_KEY_FILE: /run/auth-keys/private.pem
      AUTH_PUBLIC_KEY_FILE: /run/auth-keys/public.pem
      TOTP_ISSUER: ${TOTP_ISSUER:-Connected-Neighboors}
      # Email via Resend en prod (pas de mailpit). L'envoi est neutre si RESEND_API_KEY est absent.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:?set in the SOPS env}
      APP_NAME: ${APP_NAME:-Connected-Neighboors}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  # Les fronts servent des bundles statiques pré-buildés (URLs VITE_* figées au build CI).
  # Aucun port hôte — Caddy est le seul point d'entrée.
  admin-front:
    image: ghcr.io/esgi-3al2-pa/web-apps/admin-front:latest
    restart: always
    depends_on:
      - auth-service

  user-front:
    image: ghcr.io/esgi-3al2-pa/web-apps/user-front:latest
    restart: always
    depends_on:
      - api
      - auth-service

  landing:
    image: ghcr.io/esgi-3al2-pa/web-apps/landing:latest
    restart: always

  # ── Datastores ───────────────────────────────────────────────────────────────
  # Replica set à un seul membre — requis par le watcher offline-sync de l'api basé
  # sur les Change Streams (db.watch() échoue sur un mongod standalone) et débloque les
  # transactions multi-documents. Un membre + auth root n'a pas besoin de keyfile ;
  # ajouter des membres plus tard en exigerait un.
  mongodb:
    image: mongo:8
    restart: always
    # Un keyFile est obligatoire dès que auth ET réplication sont tous deux actifs — sans
    # lui mongod s'arrête avec `BadValue: security.keyFile is required when authorization
    # is enabled with replica sets`. Copié en 0400/mongodb au démarrage car un fichier
    # bind-monté ne peut pas porter le mode/propriétaire requis.
    # PROD : MONGO_KEYFILE_PATH doit pointer vers un vrai secret (provisionné par SOPS sur
    # l'hôte) — jamais le keyfile de dev commité dans ./docker/mongo-keyfile.
    command:
      - bash
      - -c
      - |
        install -m 400 -o mongodb -g mongodb /etc/mongo/keyfile /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    # Aucun port hôte : joignable uniquement via le réseau interne compose. Ne jamais
    # exposer un datastore à l'hôte en prod (bind 0.0.0.0 = BD joignable depuis Internet).
    volumes:
      - mongodb_data:/data/db
      - ${MONGO_KEYFILE_PATH:?set in the SOPS env — path to the rs0 keyfile}:/etc/mongo/keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in the SOPS env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in the SOPS env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot idempotent : initialise rs0 sur un volume vierge, puis s'arrête. Chaque
  # service qui se connecte à Mongo attend son achèvement.
  mongo-init:
    image: mongo:8
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - -u
      - ${MONGO_ROOT_USERNAME:?set in the SOPS env}
      - -p
      - ${MONGO_ROOT_PASSWORD:?set in the SOPS env}
      - --quiet
      - --eval
      - >
        try { if (rs.status().ok) { print("rs0 already initiated"); quit(0); } } catch (e) {}
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
        print("rs0 initiated");

  neo4j:
    image: neo4j:5
    restart: always
    # Aucun port hôte : joignable uniquement via le réseau interne compose (voir mongodb).
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in the SOPS env}
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "${NEO4J_PASSWORD}" ''RETURN 1''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Stockage objet compatible S3 partagé par l'app principale (messages vocaux, images
  # d'annonces) et Documenso.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${DOCUMENSO_S3_ACCESS_KEY:?set in the SOPS env}
      MINIO_ROOT_PASSWORD: ${DOCUMENSO_S3_SECRET_KEY:?set in the SOPS env}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot : crée les buckets (PDFs documenso + messages vocaux + annonces), puis s'arrête.
  minio-createbucket:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "${DOCUMENSO_S3_ACCESS_KEY}" "${DOCUMENSO_S3_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing local/documenso;
        mc mb --ignore-existing local/messages;
        mc mb --ignore-existing local/listings;
        exit 0;

  # ── Signature électronique Documenso (auto-hébergée) — valeurs prod issues de l'env SOPS ──
  documenso-db:
    image: postgres:15
    restart: always
    volumes:
      - documenso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER:?set in the SOPS env}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:?set in the SOPS env}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME:-documenso}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI de signature électronique — aucun port hôte ; Caddy la fronte en TLS (les liens de
  # signature doivent être en https).
  documenso:
    image: documenso/documenso:v2.15.0
    restart: always
    depends_on:
      documenso-db:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    volumes:
      - ${DOCUMENSO_CERT_PATH:-./docker/documenso/cert.p12}:/opt/documenso/cert.p12:ro
    environment:
      PORT: "${DOCUMENSO_PORT:-3030}"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?set in the SOPS env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?set in the SOPS env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?set in the SOPS env}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:?set in the SOPS env}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:${DOCUMENSO_PORT:-3030}
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: api
      NEXT_PRIVATE_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: ${DOCUMENSO_S3_REGION:-us-east-1}
      NEXT_PRIVATE_UPLOAD_BUCKET: ${DOCUMENSO_S3_BUCKET:-documenso}
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: ${DOCUMENSO_S3_ACCESS_KEY}
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: ${DOCUMENSO_S3_SECRET_KEY}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: smtp.resend.com
      NEXT_PRIVATE_SMTP_PORT: "465"
      NEXT_PRIVATE_SMTP_SECURE: "true"
      NEXT_PRIVATE_SMTP_USERNAME: resend
      NEXT_PRIVATE_SMTP_PASSWORD: ${RESEND_API_KEY:?set in the SOPS env}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${APP_NAME:-Connected-Neighboors}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${FROM_EMAIL:?set in the SOPS env}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-}

  # One-shot : seed MongoDB + Neo4j avec des données d'exemple, puis s'arrête. Idempotent ;
  # se relance sans risque à chaque `up`. Réutilise l'image api.
  api-seed:
    image: ghcr.io/esgi-3al2-pa/web-apps/api:latest
    restart: "no"
    command: ["node", "apps/api/dist/scripts/seed.js"]
    environment:
      NODE_ENV: production
      # Sélectionne seed-data/<name>.txt embarqué dans l'image.
      SEED_SCENARIO: ${SEED_SCENARIO:-demo}
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in the SOPS env}:${MONGO_ROOT_PASSWORD:?set in the SOPS env}@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-db}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in the SOPS env}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  # One-shot : seed/promotion du compte superAdmin (idempotent, clé sur l'email).
  auth-seed:
    image: ghcr.io/esgi-3al2-pa/web-apps/auth-service:latest
    restart: "no"
    command: ["node", "apps/auth-service/dist/seed-superadmin.js"]
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in the SOPS env}:${MONGO_ROOT_PASSWORD:?set in the SOPS env}@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-db}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@local.dev}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set in the SOPS env}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      # Volontairement PAS ordonné après api-seed comme dans le compose dev : api-seed
      # refuse de tourner ici (NODE_ENV=production) et sort en 1, donc dépendre de son
      # succès empêcherait à jamais le provisionnement du superAdmin. Si vous activez un
      # jour SEED_ALLOW_PRODUCTION, exécutez api-seed jusqu'au bout AVANT auth-seed à la
      # main — api-seed drop la collection `users`, là où vit le superAdmin.

  # ── Reverse proxy qui termine le TLS. Route les sous-domaines vers les conteneurs
  #    applicatifs via le réseau compose ; obtient + renouvelle les certifs Let's Encrypt
  #    automatiquement. ─────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in the SOPS env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - auth-service
      - admin-front
      - user-front
      - landing

volumes:
  mongodb_data:
  neo4j_data:
  documenso_db:
  minio_data:
  caddy_data:
  caddy_config:
