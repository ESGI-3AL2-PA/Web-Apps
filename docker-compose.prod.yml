# Production stack — immutable, source-baked images.
#
# Unlike docker-compose.yml (dev) this compose:
#   • builds the `prod` Dockerfile target for every app (no `dev` / tsx --watch),
#   • has NO source bind-mounts — the image is the artifact,
#   • serves each front's built `dist/` from a hardened, non-root nginx
#     (listening on 8080) instead of `vite preview`,
#   • runs the backends from their compiled `dist/` with `node`.
#
# `docker compose up` starts the whole stack — app + datastores + fronts + the
# Documenso e-signature services (no profiles).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Frontend service URLs are baked into the SPA bundles at BUILD time (Vite inlines
# VITE_* — see packages/config), so set the VITE_* values in .env before building.
# auth-service needs a STABLE RS256 keypair in prod (ephemeral keys rotate on
# restart and break JWT verification): generate one with scripts/gen-auth-keys.sh
# into ./docker/auth/ — it is mounted read-only below.
services:
  api:
    restart: always
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_PORT: 3000
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-db}
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
      # Behind a reverse proxy / LB: set TRUST_PROXY to the number of trusted hops.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Voice-message + listing-image storage in MinIO (buckets made by minio-createbucket).
      MESSAGES_MINIO_ENDPOINT: http://minio:9000
      MESSAGES_MINIO_BUCKET: messages
      MESSAGES_MINIO_ACCESS_KEY: ${DOCUMENSO_S3_ACCESS_KEY:?set in .env}
      MESSAGES_MINIO_SECRET_KEY: ${DOCUMENSO_S3_SECRET_KEY:?set in .env}
      LISTINGS_MINIO_ENDPOINT: http://minio:9000
      LISTINGS_MINIO_BUCKET: listings
      LISTINGS_MINIO_ACCESS_KEY: ${DOCUMENSO_S3_ACCESS_KEY:?set in .env}
      LISTINGS_MINIO_SECRET_KEY: ${DOCUMENSO_S3_SECRET_KEY:?set in .env}
      # Documenso reached in-network; secrets come from .env (created once in the UI).
      DOCUMENSO_URL: http://documenso:3030
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_TEMPLATE_ID: ${DOCUMENSO_TEMPLATE_ID:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
      DOCUMENSO_SIGNING_LANGUAGE: ${DOCUMENSO_SIGNING_LANGUAGE:-fr}
      DOCUMENSO_DOWNLOAD_HOSTS: ${DOCUMENSO_DOWNLOAD_HOSTS:-minio:9000}
      CONTRACTS_SIGN_REDIRECT_URL: ${CONTRACTS_SIGN_REDIRECT_URL:-http://localhost:${USER_PORT:-5000}/mes-contrats}
    depends_on:
      - mongodb
      - neo4j
      - auth-service
      - minio-createbucket
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    restart: always
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: prod
    ports:
      - "${AUTH_PORT:-3001}:3001"
    # Stable RS256 keys (read-only). Generate with scripts/gen-auth-keys.sh → ./docker/auth/.
    volumes:
      - ./docker/auth:/run/auth-keys:ro
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-db}
      API_URL: http://api:3000
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      AUTH_PRIVATE_KEY_FILE: /run/auth-keys/private.pem
      AUTH_PUBLIC_KEY_FILE: /run/auth-keys/public.pem
      TOTP_ISSUER: ${TOTP_ISSUER:-Connected-Neighboors}
      # Email via Resend in prod (no mailpit). Mail is a no-op if RESEND_API_KEY is unset.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:?set in .env}
      APP_NAME: ${APP_NAME:-Connected-Neighboors}
    depends_on:
      - mongodb

  admin-front:
    restart: always
    build:
      context: .
      dockerfile: apps/admin-front/Dockerfile
      target: prod
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:${AUTH_PORT:-3001}}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-3000}}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:${USER_PORT:-5000}}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:${ADMIN_PORT:-4000}}
    ports:
      - "${ADMIN_PORT:-4000}:8080"
    depends_on:
      - auth-service

  user-front:
    restart: always
    build:
      context: .
      dockerfile: apps/user-front/Dockerfile
      target: prod
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:${AUTH_PORT:-3001}}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-3000}}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:${USER_PORT:-5000}}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:${ADMIN_PORT:-4000}}
    ports:
      - "${USER_PORT:-5000}:8080"
    depends_on:
      - api
      - auth-service

  landing:
    restart: always
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: prod
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:${AUTH_PORT:-3001}}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-3000}}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:${USER_PORT:-5000}}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:${ADMIN_PORT:-4000}}
    ports:
      - "${LANDING_PORT:-6060}:8080"

  # ── Datastores ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    restart: on-failure
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      # Protect the admin UI with HTTP basic auth (required in prod).
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:?set in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set in .env}
    depends_on:
      - mongodb

  neo4j:
    image: neo4j:5
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "${NEO4J_PASSWORD}" ''RETURN 1''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # S3-compatible object storage shared by the core app (voice messages, listing
  # images) and Documenso.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${DOCUMENSO_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${DOCUMENSO_S3_SECRET_KEY:?set in .env}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the buckets (documenso PDFs + voice messages + listings), then exit.
  minio-createbucket:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "${DOCUMENSO_S3_ACCESS_KEY}" "${DOCUMENSO_S3_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing local/documenso;
        mc mb --ignore-existing local/messages;
        mc mb --ignore-existing local/listings;
        exit 0;

  # ── Documenso e-signature (self-hosted) — prod values come from env ──────────
  documenso-db:
    image: postgres:15
    restart: always
    volumes:
      - documenso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME:-documenso}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  documenso:
    image: documenso/documenso:v2.15.0
    restart: always
    depends_on:
      documenso-db:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    ports:
      - "${DOCUMENSO_PORT:-3030}:${DOCUMENSO_PORT:-3030}"
    volumes:
      - ${DOCUMENSO_CERT_PATH:-./docker/documenso/cert.p12}:/opt/documenso/cert.p12:ro
    environment:
      PORT: "${DOCUMENSO_PORT:-3030}"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?set in .env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?set in .env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?set in .env}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:?set in .env}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:${DOCUMENSO_PORT:-3030}
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: api
      NEXT_PRIVATE_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: ${DOCUMENSO_S3_REGION:-us-east-1}
      NEXT_PRIVATE_UPLOAD_BUCKET: ${DOCUMENSO_S3_BUCKET:-documenso}
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: ${DOCUMENSO_S3_ACCESS_KEY}
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: ${DOCUMENSO_S3_SECRET_KEY}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: smtp.resend.com
      NEXT_PRIVATE_SMTP_PORT: "465"
      NEXT_PRIVATE_SMTP_SECURE: "true"
      NEXT_PRIVATE_SMTP_USERNAME: resend
      NEXT_PRIVATE_SMTP_PASSWORD: ${RESEND_API_KEY:?set in .env}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${APP_NAME:-Connected-Neighboors}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${FROM_EMAIL:?set in .env}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-}

  # One-shot: seed MongoDB + Neo4j with sample data, then exit. Idempotent; re-runs
  # safely on every `up`. Reuses the api image.
  api-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: "no"
    command: ["npx", "tsx", "apps/api/src/scripts/seed.ts"]
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-db}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in .env}
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # One-shot: seed/promote the superAdmin account (idempotent, keyed on email).
  auth-seed:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: prod
    restart: "no"
    command: ["npx", "tsx", "apps/auth-service/src/seed-superadmin.ts"]
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-db}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@local.dev}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set in .env}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  neo4j_data:
  documenso_db:
  minio_data:
