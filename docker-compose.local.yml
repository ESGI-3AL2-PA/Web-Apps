services:
  mongodb:
    profiles: [core]
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  mongo-express:
    profiles: [core]
    image: mongo-express:latest
    restart: on-failure
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  neo4j:
    profiles: [core]
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password

  # Local SMTP sink. Documenso requires an SMTP transport to boot; mailpit
  # accepts everything and exposes a web UI on 8025 so we can read the signing
  # invitation emails (and grab the signing links) during local E2E testing.
  mailpit:
    profiles: [core, contracts]
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Dedicated Postgres for Documenso (it is Prisma/Postgres; cannot share Mongo).
  documenso-db:
    profiles: [contracts]
    image: postgres:15
    ports:
      - "${DOCUMENSO_DB_PORT:-5432}:5432"
    volumes:
      - documenso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
      POSTGRES_DB: documenso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted Documenso (community edition). Stores uploaded/signed PDFs in MinIO
  # (S3 transport — required for the api to download the PDF for in-app preview),
  # mails via mailpit, signs with a local dev P12 cert (scripts/gen-documenso-cert.sh).
  # Browser-facing on http://localhost:${DOCUMENSO_PORT:-3030}; the api reaches it
  # in-network at http://documenso:3030 and its webhooks reach the api at api:3000.
  documenso:
    profiles: [contracts]
    image: documenso/documenso:latest
    depends_on:
      documenso-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    # Same host/container port so the app's internal job queue (which posts jobs —
    # incl. outbound email — to NEXT_PUBLIC_WEBAPP_URL) can reach itself over loopback.
    ports:
      - "${DOCUMENSO_PORT:-3030}:${DOCUMENSO_PORT:-3030}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/documenso/cert.p12:/opt/documenso/cert.p12:ro
    environment:
      PORT: "${DOCUMENSO_PORT:-3030}"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-documenso-dev-nextauth-secret}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-documenso-dev-encryption-key-primary}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-documenso-dev-encryption-key-secondary}
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:${DOCUMENSO_PORT:-3030}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:${DOCUMENSO_PORT:-3030}
      # Documenso blocks webhooks to private/loopback addresses (SSRF guard). Our
      # api runs in-network as `api`, so allowlist it (host.docker.internal kept for
      # the case where the api is run on the host via `npm run dev`).
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: api,host.docker.internal,localhost
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      # S3 (MinIO) storage so the api can download the PDF via the v1 API for preview.
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: us-east-1
      NEXT_PRIVATE_UPLOAD_BUCKET: documenso
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: minioadmin
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      # SMTP → mailpit (no auth, plaintext).
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: "1025"
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: Documenso Local
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: documenso@local.dev
      # Local dev signing certificate.
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ""

  # S3-compatible object storage. Documenso stores its PDFs here (contracts profile);
  # the core app also stores voice messages here, so it runs in both profiles.
  minio:
    profiles: [core, contracts]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the buckets (documenso PDFs + voice messages), then exit.
  minio-createbucket:
    profiles: [core, contracts]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/documenso;
        mc mb --ignore-existing local/messages;
        mc mb --ignore-existing local/listings;
        exit 0;

  # ── Application services (dev target, hot-reload via bind mount) ─────────────
  # Running the api in-network means it reaches documenso:3030 and minio:9000 by
  # name — no host/container split-horizon for the PDF proxy or webhooks.
  api:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3000
      MONGODB_URL: mongodb://root:root@mongodb:27017
      MONGODB_DB: db
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      # Reach auth-service in-network to purge sessions on account deletion (GDPR erasure).
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Documenso reached in-network; secrets come from .env (created once in the UI).
      DOCUMENSO_URL: http://documenso:3030
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_TEMPLATE_ID: ${DOCUMENSO_TEMPLATE_ID:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
      DOCUMENSO_SIGNING_LANGUAGE: ${DOCUMENSO_SIGNING_LANGUAGE:-fr}
      CONTRACTS_SIGN_REDIRECT_URL: ${CONTRACTS_SIGN_REDIRECT_URL:-http://localhost:${USER_PORT:-5000}/mes-contrats}
      # Voice-message storage in MinIO (bucket created by minio-createbucket).
      MESSAGES_MINIO_ENDPOINT: http://minio:9000
      MESSAGES_MINIO_BUCKET: messages
      MESSAGES_MINIO_ACCESS_KEY: minioadmin
      MESSAGES_MINIO_SECRET_KEY: minioadmin
      LISTINGS_MINIO_ENDPOINT: http://minio:9000
      LISTINGS_MINIO_BUCKET: listings
      LISTINGS_MINIO_ACCESS_KEY: minioadmin
      LISTINGS_MINIO_SECRET_KEY: minioadmin
    # No hard dependency on `documenso` (contracts profile): the api calls it lazily
    # per contract request and 502s if it's absent, so core can run without it.
    depends_on:
      - mongodb
      - auth-service
      - minio-createbucket

  auth-service:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    ports:
      - "${AUTH_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/auth-service/node_modules
    environment:
      NODE_ENV: development
      AUTH_PORT: 3001
      MONGODB_URL: mongodb://root:root@mongodb:27017
      MONGODB_DB: db
      API_URL: http://api:3000
      # Shared secret for the api→auth-service internal session-purge call (must match api).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # No AUTH_*_KEY[_FILE] set → auth-service generates ephemeral RS256 keys on boot.
      # Fine for dev (keys rotate on restart; the api's JWKS set refetches on the next
      # verification miss). Provide stable keys via AUTH_*_KEY_FILE for prod.
      # Dev email → mailpit (SMTP branch of email.service.ts). Verification/reset
      # links are read from mailpit's UI (:8025). MFA is opt-in, so no auth bypasses.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    depends_on:
      - mongodb
      - mailpit

  admin-front:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/admin-front/Dockerfile
      target: dev
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin-front/node_modules
    environment:
      NODE_ENV: development
      ADMIN_PORT: 4000
      VITE_AUTH_SERVICE_URL: http://localhost:${AUTH_PORT:-3001}
    depends_on:
      - auth-service

  user-front:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/user-front/Dockerfile
      target: dev
    ports:
      - "${USER_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/user-front/node_modules
    environment:
      NODE_ENV: development
      USER_PORT: 5000
      VITE_AUTH_SERVICE_URL: http://localhost:${AUTH_PORT:-3001}
      VITE_API_URL: http://localhost:${API_PORT:-3000}
      VITE_ADMIN_URL: http://localhost:${ADMIN_PORT:-4000}
    depends_on:
      - api
      - auth-service

volumes:
  mongodb_data:
  neo4j_data:
  documenso_db:
  minio_data:
