services:
  api:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3000 # container-internal port; host side is ${API_PORT}
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      MONGODB_DB: db
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Documenso (contracts). Reached over the docker network; the token/template/
      # secret come from .env (created once in the Documenso UI). Signing URLs that
      # Documenso returns already use its public URL (localhost:3030), browser-reachable.
      DOCUMENSO_URL: http://documenso:3030
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_TEMPLATE_ID: ${DOCUMENSO_TEMPLATE_ID:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
      DOCUMENSO_SIGNING_LANGUAGE: ${DOCUMENSO_SIGNING_LANGUAGE:-fr}
      CONTRACTS_SIGN_REDIRECT_URL: ${CONTRACTS_SIGN_REDIRECT_URL:-http://localhost:5000/mes-contrats}
    # No hard dependency on `documenso` (contracts profile): the api calls it lazily
    # per contract request and 502s if it's absent, so core can run without it.
    depends_on:
      - mongodb
      - neo4j
      - auth-service

  auth-service:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    ports:
      - "${AUTH_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/auth-service/node_modules
    environment:
      NODE_ENV: development
      AUTH_PORT: 3001 # container-internal port; host side is ${AUTH_PORT}
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      MONGODB_DB: db
      API_URL: http://api:3000
    depends_on:
      - mongodb

  admin-front:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/admin-front/Dockerfile
      target: dev
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin-front/node_modules
    environment:
      NODE_ENV: development
      ADMIN_PORT: 4000 # container-internal port; host side is ${ADMIN_PORT}
      VITE_AUTH_SERVICE_URL: http://localhost:3001
    depends_on:
      - auth-service

  user-front:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/user-front/Dockerfile
      target: dev
    ports:
      - "${USER_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/user-front/node_modules
    environment:
      NODE_ENV: development
      USER_PORT: 5000 # container-internal port; host side is ${USER_PORT}
      VITE_AUTH_SERVICE_URL: http://localhost:3001
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
      - auth-service

  mongodb:
    profiles: [core]
    image: mongo:8
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}

  mongo-express:
    profiles: [core]
    image: mongo-express:latest
    restart: on-failure
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      # Protect the admin UI with HTTP basic auth (credentials required in prod).
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:?set in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set in .env}
    depends_on:
      - mongodb

  neo4j:
    profiles: [core]
    image: neo4j:5
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password

  # ── Documenso e-signature (self-hosted) — prod values come from env ──────────
  documenso-db:
    profiles: [contracts]
    image: postgres:15
    restart: always
    volumes:
      - documenso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME:-documenso}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    profiles: [contracts]
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${DOCUMENSO_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${DOCUMENSO_S3_SECRET_KEY:?set in .env}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-createbucket:
    profiles: [contracts]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "${DOCUMENSO_S3_ACCESS_KEY}" "${DOCUMENSO_S3_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "local/${DOCUMENSO_S3_BUCKET:-documenso}";
        exit 0;

  documenso:
    profiles: [contracts]
    image: documenso/documenso:latest
    restart: always
    depends_on:
      documenso-db:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    ports:
      - "${DOCUMENSO_PORT:-3030}:${DOCUMENSO_PORT:-3030}"
    volumes:
      - ${DOCUMENSO_CERT_PATH:-./docker/documenso/cert.p12}:/opt/documenso/cert.p12:ro
    environment:
      PORT: "${DOCUMENSO_PORT:-3030}"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?set in .env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?set in .env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?set in .env}
      # Public URL the browser uses for signing pages; internal URL for the job queue.
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:?set in .env}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:${DOCUMENSO_PORT:-3030}
      # Webhooks post to the in-network api; keep the SSRF guard armed for all else.
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: api
      NEXT_PRIVATE_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: ${DOCUMENSO_S3_REGION:-us-east-1}
      NEXT_PRIVATE_UPLOAD_BUCKET: ${DOCUMENSO_S3_BUCKET:-documenso}
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: ${DOCUMENSO_S3_ACCESS_KEY}
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: ${DOCUMENSO_S3_SECRET_KEY}
      # SMTP reuses Resend (same provider as auth-service; no second provider).
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: smtp.resend.com
      NEXT_PRIVATE_SMTP_PORT: "465"
      NEXT_PRIVATE_SMTP_SECURE: "true"
      NEXT_PRIVATE_SMTP_USERNAME: resend
      NEXT_PRIVATE_SMTP_PASSWORD: ${RESEND_API_KEY:?set in .env}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${APP_NAME:-Connected-Neighboors}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${FROM_EMAIL:?set in .env}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-}

volumes:
  mongodb_data:
  neo4j_data:
  documenso_db:
  minio_data:
