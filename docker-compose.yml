services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3000 # container-internal port; host side is ${API_PORT}
      MONGODB_URL: mongodb://root:root@mongodb:27017
      MONGODB_DB: db
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
    depends_on:
      - mongodb
      - neo4j
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    ports:
      - "${AUTH_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/auth-service/node_modules
    environment:
      NODE_ENV: development
      AUTH_PORT: 3001 # container-internal port; host side is ${AUTH_PORT}
      MONGODB_URL: mongodb://root:root@mongodb:27017
      MONGODB_DB: db
      API_URL: http://api:3000
    depends_on:
      - mongodb

  admin-front:
    build:
      context: .
      dockerfile: apps/admin-front/Dockerfile
      target: dev
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin-front/node_modules
    environment:
      NODE_ENV: development
      ADMIN_PORT: 4000 # container-internal port; host side is ${ADMIN_PORT}
      VITE_AUTH_SERVICE_URL: http://localhost:3001
    depends_on:
      - auth-service

  user-front:
    build:
      context: .
      dockerfile: apps/user-front/Dockerfile
      target: dev
    ports:
      - "${USER_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/user-front/node_modules
    environment:
      NODE_ENV: development
      USER_PORT: 5000 # container-internal port; host side is ${USER_PORT}
      VITE_AUTH_SERVICE_URL: http://localhost:3001
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
      - auth-service

  mongodb:
    image: mongo:8
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  mongo-express:
    image: mongo-express:latest
    restart: on-failure
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  neo4j:
    image: neo4j:5
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password

volumes:
  mongodb_data:
  neo4j_data:
