# Stack de développement (défaut) : build depuis les sources, hot-reload via bind mount.
services:
  # Tourne comme un replica set à un seul membre : le watcher offline-sync de l'api utilise
  # les Change Streams, qui échouent sur un mongod standalone. Un RS à un membre avec auth
  # root n'a pas besoin de keyfile (un futur set multi-membres en aurait besoin). Cela
  # débloque aussi les transactions multi-documents.
  mongodb:
    image: mongo:8
    restart: unless-stopped
    # Mongo refuse de démarrer avec `BadValue: security.keyFile is required when
    # authorization is enabled with replica sets` — un keyFile est obligatoire dès que
    # auth ET réplication sont tous deux actifs, même pour un set à un membre. Le keyfile
    # est copié en 0400/mongodb au démarrage car git ne préserve ni mode ni propriétaire.
    command:
      - bash
      - -c
      - |
        install -m 400 -o mongodb -g mongodb /etc/mongo/keyfile /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-keyfile:/etc/mongo/keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot idempotent : initialise le replica set sur un volume vierge puis s'arrête.
  # Tout ce qui parle à Mongo attend son achèvement, donc aucune app ne se connecte avant
  # que rs0 n'ait un primaire.
  mongo-init:
    image: mongo:8
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - -u
      - root
      - -p
      - root
      - --quiet
      - --eval
      - >
        try { if (rs.status().ok) { print("rs0 already initiated"); quit(0); } } catch (e) {}
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
        print("rs0 initiated");

  # UI d'administration Mongo sans authentification sur :8081 (dev uniquement — le compose
  # prod la place derrière une auth HTTP basic).
  mongo-express:
    image: mongo-express:1.0.2
    restart: on-failure
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Puits SMTP local. Documenso exige un transport SMTP pour démarrer ; mailpit accepte
  # tout et expose une UI web sur 8025 pour lire les emails d'invitation à signer (et en
  # récupérer les liens de signature) lors des tests E2E locaux.
  mailpit:
    image: axllent/mailpit:v1.20.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Postgres dédié à Documenso (Prisma/Postgres ; ne peut pas partager Mongo).
  documenso-db:
    image: postgres:15
    ports:
      - "${DOCUMENSO_DB_PORT:-5432}:5432"
    volumes:
      - documenso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
      POSTGRES_DB: documenso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Documenso auto-hébergé (édition community). Stocke les PDFs uploadés/signés dans MinIO
  # (transport S3 — requis pour que l'api télécharge le PDF et l'affiche en aperçu in-app),
  # envoie les mails via mailpit, signe avec un cert P12 de dev local (scripts/gen-documenso-cert.sh).
  # Côté navigateur sur http://localhost:${DOCUMENSO_PORT:-3030} ; l'api le joint en réseau
  # interne sur http://documenso:3030 et ses webhooks atteignent l'api sur api:3000.
  documenso:
    image: documenso/documenso:v2.15.0
    depends_on:
      documenso-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    # Même port hôte/conteneur pour que la file de jobs interne de l'app (qui poste des
    # jobs — dont l'email sortant — vers NEXT_PUBLIC_WEBAPP_URL) se joigne elle-même en loopback.
    ports:
      - "${DOCUMENSO_PORT:-3030}:${DOCUMENSO_PORT:-3030}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/documenso/cert.p12:/opt/documenso/cert.p12:ro
    environment:
      PORT: "${DOCUMENSO_PORT:-3030}"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-documenso-dev-nextauth-secret}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-documenso-dev-encryption-key-primary}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-documenso-dev-encryption-key-secondary}
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:${DOCUMENSO_PORT:-3030}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:${DOCUMENSO_PORT:-3030}
      # Documenso bloque les webhooks vers les adresses privées/loopback (garde-fou SSRF).
      # Notre api tourne en réseau interne sous le nom `api`, on l'ajoute donc à l'allowlist
      # (host.docker.internal conservé pour le cas où l'api tourne sur l'hôte via `npm run dev`).
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: api,host.docker.internal,localhost
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      # Stockage S3 (MinIO) pour que l'api télécharge le PDF via l'API v1 en vue de l'aperçu.
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: us-east-1
      NEXT_PRIVATE_UPLOAD_BUCKET: documenso
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: minioadmin
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      # SMTP → mailpit (sans auth, en clair).
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: "1025"
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: Documenso Local
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: documenso@local.dev
      # Certificat de signature de dev local.
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ""

  # Stockage objet compatible S3. Documenso y range ses PDFs signés, et l'app principale
  # y range les messages vocaux + images d'annonces.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot : crée les buckets (PDFs documenso + messages vocaux), puis s'arrête.
  minio-createbucket:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/documenso;
        mc mb --ignore-existing local/messages;
        mc mb --ignore-existing local/listings;
        exit 0;

  # ── Services applicatifs (cible dev, hot-reload via bind mount) ─────────────
  # Faire tourner l'api en réseau interne lui permet de joindre documenso:3030 et
  # minio:9000 par leur nom — pas de split-horizon hôte/conteneur pour le proxy PDF
  # ou les webhooks.
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3000
      MONGODB_URL: mongodb://root:root@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: db
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
      # Joint l'auth-service en réseau interne pour purger les sessions à la suppression de compte (effacement RGPD).
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Documenso joignable en réseau interne ; secrets issus du .env (créés une fois via l'UI).
      DOCUMENSO_URL: http://documenso:3030
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_TEMPLATE_ID: ${DOCUMENSO_TEMPLATE_ID:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
      DOCUMENSO_SIGNING_LANGUAGE: ${DOCUMENSO_SIGNING_LANGUAGE:-fr}
      CONTRACTS_SIGN_REDIRECT_URL: ${CONTRACTS_SIGN_REDIRECT_URL:-http://localhost:${USER_PORT:-5000}/mes-contrats}
      # Stockage des messages vocaux dans MinIO (bucket créé par minio-createbucket).
      MESSAGES_MINIO_ENDPOINT: http://minio:9000
      MESSAGES_MINIO_BUCKET: messages
      MESSAGES_MINIO_ACCESS_KEY: minioadmin
      MESSAGES_MINIO_SECRET_KEY: minioadmin
      LISTINGS_MINIO_ENDPOINT: http://minio:9000
      LISTINGS_MINIO_BUCKET: listings
      LISTINGS_MINIO_ACCESS_KEY: minioadmin
      LISTINGS_MINIO_SECRET_KEY: minioadmin
    # Pas de dépendance dure à `documenso` : l'api l'appelle paresseusement par requête
    # de contrat et renvoie 502 s'il est absent, donc l'app peut tourner sans lui.
    # Attendre que les datastores soient PRÊTS, pas seulement démarrés — l'api se connecte
    # à Mongo + Neo4j au boot et échoue vite (tsx --watch ne réessaie pas tout seul) sinon.
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      auth-service:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    ports:
      - "${AUTH_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/auth-service/node_modules
    environment:
      NODE_ENV: development
      AUTH_PORT: 3001
      MONGODB_URL: mongodb://root:root@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: db
      API_URL: http://api:3000
      # Secret partagé pour l'appel interne api→auth-service de purge de sessions (doit correspondre à celui de l'api).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
      # Aucune AUTH_*_KEY[_FILE] définie → l'auth-service génère des clés RS256 éphémères
      # au boot. OK en dev (les clés tournent au redémarrage ; le JWKS set de l'api se
      # rafraîchit au prochain échec de vérification). Fournir des clés stables via
      # AUTH_*_KEY_FILE en prod.
      # Email dev → mailpit (branche SMTP de email.service.ts). Les liens de vérification/
      # réinitialisation se lisent dans l'UI de mailpit (:8025). Le MFA est opt-in, donc
      # aucun contournement d'auth.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  admin-front:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/admin-front/Dockerfile
      target: dev
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin-front/node_modules
    environment:
      NODE_ENV: development
      ADMIN_PORT: 4000
      VITE_AUTH_SERVICE_URL: http://localhost:${AUTH_PORT:-3001}
    depends_on:
      - auth-service

  user-front:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/user-front/Dockerfile
      target: dev
    ports:
      - "${USER_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/user-front/node_modules
    environment:
      NODE_ENV: development
      USER_PORT: 5000
      VITE_AUTH_SERVICE_URL: http://localhost:${AUTH_PORT:-3001}
      VITE_API_URL: http://localhost:${API_PORT:-3000}
      VITE_ADMIN_URL: http://localhost:${ADMIN_PORT:-4000}
    depends_on:
      - api
      - auth-service

  landing:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: dev
    ports:
      - "${LANDING_PORT:-6060}:6060"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/landing/node_modules
    environment:
      NODE_ENV: development
      LANDING_PORT: 6060
      VITE_AUTH_SERVICE_URL: http://localhost:${AUTH_PORT:-3001}
      VITE_API_URL: http://localhost:${API_PORT:-3000}
      VITE_APP_URL: http://localhost:${USER_PORT:-5000}
      VITE_ADMIN_URL: http://localhost:${ADMIN_PORT:-4000}
    depends_on:
      - auth-service

  # One-shot : seed MongoDB + Neo4j avec des données d'exemple, puis s'arrête. Idempotent
  # (clé sur des IDs de seed déterministes), donc se relance sans risque à chaque `up`.
  # Réutilise l'image api.
  api-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # build, pas dev : le stage dev ne copie que apps/api/src, donc @repo/shared
      # se résout vers un package sans dist/. Le service api s'en sort car il bind-monte
      # le repo ; un seed one-shot n'a pas de mount.
      target: build
    restart: "no"
    command: ["npx", "tsx", "apps/api/src/scripts/seed.ts"]
    environment:
      NODE_ENV: development
      # Sélectionne seed-data/<name>.txt. Définir SEED_SCENARIO dans .env pour changer de
      # jeu de données sans redéclarer tout le tableau `command` dans un fichier d'override.
      SEED_SCENARIO: ${SEED_SCENARIO:-demo}
      MONGODB_URL: mongodb://root:root@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: db
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  # One-shot : seed/promotion du compte superAdmin (idempotent, clé sur l'email).
  auth-seed:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      # build, pas dev — voir api-seed.
      target: build
    restart: "no"
    command: ["npx", "tsx", "apps/auth-service/src/seed-superadmin.ts"]
    environment:
      NODE_ENV: development
      MONGODB_URL: mongodb://root:root@mongodb:27017/?replicaSet=rs0
      MONGODB_DB: db
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@local.dev}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-ChangeMe!2345}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      # Doit tourner APRÈS api-seed : celui-ci drop entièrement la collection `users`, ce
      # qui emporterait le superAdmin avec elle. Sans ça les deux one-shots se courent
      # après et le superAdmin survit ou non selon lequel finit en dernier.
      api-seed:
        condition: service_completed_successfully

volumes:
  mongodb_data:
  neo4j_data:
  documenso_db:
  minio_data:
