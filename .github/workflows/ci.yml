name: CI

# Integration continue : sur chaque PR vers main et chaque push sur main, installe les
# dependances puis lance build + lint + test sur tout le monorepo turbo (sauf la suite E2E).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Aligne sur la ligne Node 22 LTS des images Docker (apps/*/Dockerfile) pour que la CI
        # teste sur le meme runtime que celui deploye.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright_testbook est une suite E2E qui frappe un backend vivant (api,
      # auth-service, Mongo/Neo4j) que ce job ne provisionne pas ; elle est donc
      # exclue ici. Les suites vitest (api, auth-service) restent bloquantes, et toute
      # nouvelle suite de tests unitaires est prise en compte automatiquement.
      - name: Build, lint & test
        run: npx turbo run build lint test --filter='!playwright_testbook'
