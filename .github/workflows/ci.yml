name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright_testbook is an E2E suite that hits a live backend (api,
      # auth-service, Mongo/Neo4j) which this job does not provision, so it is
      # excluded here. The vitest suites (api, auth-service) still gate, and any
      # new unit test suites are picked up automatically.
      - name: Build, lint & test
        run: npx turbo run build lint test --filter='!playwright_testbook'
