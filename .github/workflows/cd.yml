name: CD

# Manual continuous delivery + deployment. Building each app's prod image, pushing it to
# GHCR, and (optionally) rolling it out to the self-hosted VM over SSH. Triggered by hand
# from the Actions tab so deploys are deliberate.
#
# One SOPS-encrypted file (deploy/secrets/prod.enc.env) is the single source of truth for
# every secret AND every environment URL. CI decrypts only the public VITE_* URLs (via the
# SOPS_AGE_KEY secret) to bake into the front bundles; the VM decrypts the whole file at
# runtime with its own age key.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/SHA) to build & deploy
        required: false
        default: main
      deploy:
        description: Deploy to the VM after building (needs DEPLOY_HOST configured)
        type: boolean
        required: false
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to GHCR
  security-events: write # upload Trivy SARIF

jobs:
  build-push:
    name: Build & push · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, auth-service, admin-front, user-front, landing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # GHCR image paths must be lowercase; the repo owner has capitals.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Fronts bake their API/auth URLs into the bundle at build time. Pull ONLY the public
      # VITE_* URLs out of the SOPS file (real secrets stay encrypted and never touch the log
      # or $GITHUB_ENV) so they can be passed as build args.
      - name: Decrypt front URLs (fronts only)
        if: contains(fromJSON('["admin-front","user-front","landing"]'), matrix.app)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          for k in VITE_AUTH_SERVICE_URL VITE_API_URL VITE_APP_URL VITE_ADMIN_URL; do
            echo "$k=$(sops -d --input-type dotenv --extract "[\"$k\"]" deploy/secrets/prod.enc.env)" >> "$GITHUB_ENV"
          done

      - name: Build & push (prod target)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Empty for the backends (they ignore unknown args); populated for the fronts.
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ env.VITE_AUTH_SERVICE_URL }}
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_APP_URL=${{ env.VITE_APP_URL }}
            VITE_ADMIN_URL=${{ env.VITE_ADMIN_URL }}

      # Report-only: surface CRITICAL/HIGH fixable CVEs in the Security tab without blocking
      # delivery on unfixable base-image noise.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  deploy:
    name: Deploy to VM
    needs: build-push
    runs-on: ubuntu-latest
    # Skipped until a deploy target is configured, so build/push/scan is green out of the box.
    # Set the DEPLOY_HOST/DEPLOY_USER/DEPLOY_PATH repo Variables + DEPLOY_SSH_KEY secret to enable.
    if: ${{ inputs.deploy && vars.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - name: Roll out over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA
          # The VM holds the age private key (~/.config/sops/age/keys.txt), docker/auth/ RS256
          # keys, and the caddy volumes. It downloads the raw compose/Caddyfile/encrypted-env
          # pinned to this commit, then sops-decrypts the secrets into the environment for
          # compose interpolation (no plaintext secret ever lands on disk).
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}"
            for f in docker-compose.deploy.yml Caddyfile deploy/secrets/prod.enc.env; do
              curl -fsSL "$RAW/$f" --create-dirs -o "$f"
            done
            C="docker compose -f docker-compose.deploy.yml"
            sops exec-env deploy/secrets/prod.enc.env "\
              $C pull && \
              $C run --rm api npx tsx apps/api/src/scripts/migrate.ts && \
              $C up -d --no-build"
            docker image prune -f
