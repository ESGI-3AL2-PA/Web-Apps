name: CD

# Livraison + deploiement continus manuels. Construit l'image de prod de chaque app, la pousse
# vers GHCR et (optionnellement) la deploie sur la VM auto-hebergee via SSH. Declenche a la main
# depuis l'onglet Actions pour que les deploiements restent deliberes.
#
# Un unique fichier chiffre par SOPS (prod.enc.env) est la source de verite unique pour
# TOUS les secrets ET toutes les URL d'environnement. La CI ne dechiffre que les URL publiques
# VITE_* (via le secret SOPS_AGE_KEY) pour les figer dans les bundles des fronts ; la VM
# dechiffre le fichier entier a l'execution avec sa propre cle age.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/SHA) to build & deploy
        required: false
        default: main
      deploy:
        description: Deploy to the VM after building (needs DEPLOY_HOST configured)
        type: boolean
        required: false
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # pousser vers GHCR
  security-events: write # televerser le SARIF de Trivy

jobs:
  build-push:
    name: Build & push · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, auth-service, admin-front, user-front, landing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Les chemins d'image GHCR doivent etre en minuscules ; le proprietaire du depot a des majuscules.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Les fronts figent leurs URL API/auth dans le bundle au build. On extrait UNIQUEMENT les
      # URL publiques VITE_* du fichier SOPS (les vrais secrets restent chiffres et ne touchent
      # jamais le log ni $GITHUB_ENV) afin de les passer en build args.
      - name: Decrypt front URLs (fronts only)
        if: contains(fromJSON('["admin-front","user-front","landing"]'), matrix.app)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          for k in VITE_AUTH_SERVICE_URL VITE_API_URL VITE_APP_URL VITE_ADMIN_URL VITE_LANDING_URL; do
            echo "$k=$(sops -d --input-type dotenv --extract "[\"$k\"]" prod.enc.env)" >> "$GITHUB_ENV"
          done

      - name: Build & push (prod target)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Vide pour les backends (ils ignorent les args inconnus) ; renseigne pour les fronts.
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ env.VITE_AUTH_SERVICE_URL }}
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_APP_URL=${{ env.VITE_APP_URL }}
            VITE_ADMIN_URL=${{ env.VITE_ADMIN_URL }}
            VITE_LANDING_URL=${{ env.VITE_LANDING_URL }}

      # Simple rapport : remonte les CVE CRITICAL/HIGH corrigeables dans l'onglet Security sans
      # bloquer la livraison sur le bruit non corrigeable des images de base.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  deploy:
    name: Deploy to VM
    needs: build-push
    runs-on: ubuntu-latest
    # Ignore tant qu'aucune cible de deploiement n'est configuree, pour que build/push/scan
    # soit vert d'emblee. Definir les Variables DEPLOY_HOST/DEPLOY_USER/DEPLOY_PATH + le secret
    # DEPLOY_SSH_KEY pour l'activer.
    if: ${{ inputs.deploy && vars.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - name: Roll out over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ github.sha }}
          # Token ephemere limite au job (packages:write => read) pour que la VM tire les images
          # GHCR privees sans PAT longue duree stocke sur la machine. Expire a la fin du job.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA,GHCR_USER,GHCR_TOKEN
          # La VM detient la cle privee age (~/.config/sops/age/keys.txt), les cles RS256 de
          # docker/auth/ et les volumes de caddy. Elle telecharge les compose/Caddyfile/env-chiffre
          # bruts epingles a ce commit, puis sops dechiffre les secrets dans l'environnement pour
          # l'interpolation de compose (aucun secret en clair n'atterrit sur le disque).
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}"
            for f in docker-compose.deploy.yml Caddyfile prod.enc.env; do
              curl -fsSL "$RAW/$f" --create-dirs -o "$f"
            done
            # Authentification a GHCR juste-a-temps pour que `compose pull` lise les images privees.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            C="docker compose -f docker-compose.deploy.yml"
            sops exec-env prod.enc.env "\
              $C pull && \
              $C run --rm api node apps/api/dist/scripts/migrate.js && \
              $C up -d --no-build"
            docker image prune -f
