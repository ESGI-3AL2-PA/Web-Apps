name: Claude Code

# Assistant Claude sur demande. Se declenche quand "@claude" est mentionne dans un commentaire
# d'issue/PR, une revue de PR, ou le corps/titre d'une issue (voir la garde `if` du job). Sans
# prompt explicite, Claude execute les instructions du commentaire qui l'a mentionne.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Necessaire pour que Claude lise les resultats de CI sur les PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Reglage optionnel qui autorise Claude a lire les resultats de CI sur les PR
          additional_permissions: |
            actions: read

          # Optionnel : fournir un prompt personnalise a Claude. S'il n'est pas defini, Claude execute
          # les instructions du commentaire qui l'a mentionne.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optionnel : ajouter claude_args pour ajuster le comportement et la configuration.
          # Voir https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # ou https://code.claude.com/docs/en/cli-reference pour les options disponibles.
          # claude_args: '--allowed-tools Bash(gh pr *)'
