name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/esgi-3al2-pa/web-apps

jobs:
  # ── Lint + build on every PR and every push to main ────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ── Build + push images to GHCR (main only) ────────────────────────────────
  build-push:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - app: admin-front
            dockerfile: apps/admin-front/Dockerfile
            build_args: |
              VITE_AUTH_SERVICE_URL=${{ vars.VITE_AUTH_SERVICE_URL }}
          - app: user-front
            dockerfile: apps/user-front/Dockerfile
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
              VITE_AUTH_SERVICE_URL=${{ vars.VITE_AUTH_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ── Deploy to the VPS over SSH (main only) ─────────────────────────────────
  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG
          script: cd /opt/web-apps && TAG=${{ github.sha }} ./scripts/deploy.sh
        env:
          TAG: ${{ github.sha }}
