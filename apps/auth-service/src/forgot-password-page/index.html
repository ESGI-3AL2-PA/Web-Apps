<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe oublié</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }
      .hint {
        font-size: 0.8125rem;
        color: #6b7280;
        margin: -0.5rem 0 1rem;
      }
      button {
        width: 100%;
        padding: 0.625rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        display: none;
      }
      .link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .link a {
        color: #2563eb;
        text-decoration: none;
      }
      .link a:hover {
        text-decoration: underline;
      }
      .icon {
        font-size: 2.5rem;
        line-height: 1;
        margin-bottom: 1rem;
        text-align: center;
      }
      .icon.ok {
        color: #059669;
      }
      .lang-toggle {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        color: #9ca3af;
      }
      .lang-toggle a {
        color: #6b7280;
        text-decoration: none;
        margin: 0 0.25rem;
      }
      .lang-toggle a:hover {
        text-decoration: underline;
      }
      .lang-toggle a.active {
        color: #2563eb;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1 data-i18n="title">Mot de passe oublié</h1>
      <div id="error" class="error"></div>
      <form id="forgotForm">
        <label for="email" data-i18n="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <p class="hint" data-i18n="hint">
          Saisissez l'adresse e-mail de votre compte et nous vous enverrons un lien de réinitialisation.
        </p>
        <button type="submit" id="submitBtn" data-i18n="submit">Envoyer le lien</button>
      </form>
      <div class="link">
        <a id="loginLink" href="/login" data-i18n="backToSignIn">Retour à la connexion</a>
      </div>
      <div class="lang-toggle">
        <a data-lang="fr" href="?lang=fr">Français</a> ·
        <a data-lang="en" href="?lang=en">English</a>
      </div>
    </div>

    <script>
      const I18N = {
        fr: {
          title: "Mot de passe oublié",
          email: "E-mail",
          hint: "Saisissez l'adresse e-mail de votre compte et nous vous enverrons un lien de réinitialisation.",
          submit: "Envoyer le lien",
          backToSignIn: "Retour à la connexion",
          invalidEmail: "Saisissez une adresse e-mail valide.",
          sendFailed: "Échec de l'envoi, réessayez.",
          sentTitle: "Vérifiez votre boîte mail",
          sentBody:
            "Si un compte existe pour cette adresse, un e-mail contenant un lien de réinitialisation vient d'être envoyé. Pensez à vérifier vos courriers indésirables.",
          backToLogin: "Retour à la connexion",
        },
        en: {
          title: "Forgot password",
          email: "Email",
          hint: "Enter your account email and we'll send you a reset link.",
          submit: "Send reset link",
          backToSignIn: "Back to sign in",
          invalidEmail: "Enter a valid email address.",
          sendFailed: "Couldn't send, try again.",
          sentTitle: "Check your inbox",
          sentBody:
            "If an account exists for that address, a password reset link has just been sent. Remember to check your spam folder.",
          backToLogin: "Back to sign in",
        },
      };

      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "en" ? "en" : "fr";
      const t = I18N[lang];
      // Injected server-side (index.ts renderPage). Send users back to /login carrying
      // redirect_uri=<APP_URL> so a successful sign-in lands them in the user app.
      const APP_URL = __APP_URL__;
      const loginHref = "/login?redirect_uri=" + encodeURIComponent(APP_URL) + "&lang=" + lang;

      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key] != null) el.textContent = t[key];
      });
      document.querySelectorAll(".lang-toggle a").forEach((a) => {
        const p = new URLSearchParams(window.location.search);
        p.set("lang", a.getAttribute("data-lang"));
        a.href = "?" + p.toString();
        if (a.getAttribute("data-lang") === lang) a.classList.add("active");
      });
      document.getElementById("loginLink").href = loginHref;

      const card = document.getElementById("card");

      // Enumeration-safe terminal state: the server always answers 200 with a generic
      // message, so the UI must reveal nothing about whether the address exists.
      function renderSent() {
        card.innerHTML =
          '<div class="icon ok">✓</div><h1>' +
          t.sentTitle +
          '</h1><p style="text-align:center">' +
          t.sentBody +
          '</p><p class="link" style="margin-top:1.5rem"><a href="' +
          loginHref +
          '"><button type="button">' +
          t.backToLogin +
          "</button></a></p>";
      }

      document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("error");
        const btn = document.getElementById("submitBtn");
        const email = document.getElementById("email").value.trim();
        errorEl.style.display = "none";

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          errorEl.textContent = t.invalidEmail;
          errorEl.style.display = "block";
          return;
        }

        btn.disabled = true;
        try {
          const res = await fetch("/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          // 200 = accepted (generic); 429 = rate-limited. Anything else is a real failure.
          if (!res.ok && res.status !== 429) throw new Error();
          renderSent();
        } catch (_) {
          errorEl.textContent = t.sendFailed;
          errorEl.style.display = "block";
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
