<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }
      button {
        width: 100%;
        padding: 0.625rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        display: none;
      }
      .link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .link a {
        color: #2563eb;
        text-decoration: none;
      }
      .link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign In</h1>
      <div id="error" class="error"></div>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
        <button type="submit" id="submitBtn">Sign In</button>
      </form>
      <div class="link">Don't have an account? <a id="registerLink" href="/register">Register</a></div>
    </div>

    <script>
      const ALLOWED_REDIRECT_ORIGINS = __ALLOWED_REDIRECT_ORIGINS__;

      // Loopback (desktop): pass access token in URL.
      // Web SPA keeps cookie flow.
      function isLoopback(origin) {
        try {
          const u = new URL(origin);
          return (
            (u.protocol === "http:" || u.protocol === "https:") &&
            (u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "::1")
          );
        } catch (_) {
          return false;
        }
      }

      function safeRedirect(raw) {
        if (!raw) return "/";
        try {
          const u = new URL(raw, window.location.origin);
          if (u.origin === window.location.origin) return u.href;
          if (ALLOWED_REDIRECT_ORIGINS.includes(u.origin)) return u.href;
          // Allow loopback origin for desktop local callback.
          if (isLoopback(u.origin)) return u.href;
        } catch (_) {}
        return "/";
      }

      // Redirect to redirect_uri.
      // For loopback targets, append access token in query.
      function redirectWithToken(token) {
        if (!token || !isLoopback(redirectUri)) {
          window.location.href = redirectUri;
          return;
        }
        const u = new URL(redirectUri);
        u.searchParams.set("access_token", token);
        window.location.href = u.href;
      }

      const params = new URLSearchParams(window.location.search);
      const redirectUri = safeRedirect(params.get("redirect_uri"));

      // Keep redirect_uri on register link.
      document.getElementById("registerLink").href = "/register?redirect_uri=" + encodeURIComponent(redirectUri);

      // Desktop loopback: try silent refresh on load.
      // If refresh cookie is valid, return token without login form.
      if (isLoopback(redirectUri)) {
        (async () => {
          try {
            const csrfRes = await fetch("/auth/csrf", { credentials: "include" });
            const csrfData = await csrfRes.json().catch(() => ({}));
            const csrf = csrfData.csrf_token;
            if (!csrf) return;
            const r = await fetch("/auth/refresh", {
              method: "POST",
              credentials: "include",
              headers: { "X-CSRF-Token": csrf },
            });
            if (!r.ok) return;
            const d = await r.json().catch(() => ({}));
            if (d.access_token) redirectWithToken(d.access_token);
          } catch (_) {
            // Ignore error and show login form.
          }
        })();
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("error");
        const btn = document.getElementById("submitBtn");
        errorEl.style.display = "none";
        btn.disabled = true;

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 202 && data.mfa_required) {
            showMfaForm(data.mfa_token);
            return;
          }

          if (!res.ok) {
            throw new Error(data.message || "Login failed");
          }

          redirectWithToken(data.access_token);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
          btn.disabled = false;
        }
      });

      function showMfaForm(mfaToken) {
        document.querySelector(".card").innerHTML =
          "<h1>Two-factor code</h1>" +
          '<div id="error" class="error"></div>' +
          '<form id="mfaForm">' +
          '<label for="code">6-digit code from your authenticator</label>' +
          '<input type="text" id="code" name="code" required inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="one-time-code">' +
          '<button type="submit" id="mfaBtn">Verify</button>' +
          "</form>";
        const errEl = document.getElementById("error");
        const btn2 = document.getElementById("mfaBtn");
        document.getElementById("mfaForm").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          errEl.style.display = "none";
          btn2.disabled = true;
          try {
            const r = await fetch("/auth/login/mfa", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ mfa_token: mfaToken, code: document.getElementById("code").value }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) {
              throw new Error(d.message || "Invalid code");
            }
            redirectWithToken(d.access_token);
          } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = "block";
            btn2.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
