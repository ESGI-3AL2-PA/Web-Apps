<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }
      button {
        width: 100%;
        padding: 0.625rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: #fff;
        color: #2563eb;
        border: 1px solid #2563eb;
      }
      .btn-secondary:hover {
        background: #eff6ff;
      }
      .resend-box {
        margin-bottom: 1rem;
      }
      .resend-prompt {
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .status {
        color: #059669;
        font-size: 0.875rem;
        text-align: center;
        margin-top: 0.75rem;
        min-height: 1.25rem;
      }
      .error {
        color: #dc2626;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        display: none;
      }
      .link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .link a {
        color: #2563eb;
        text-decoration: none;
      }
      .link a:hover {
        text-decoration: underline;
      }
      .lang-toggle {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        color: #9ca3af;
      }
      .lang-toggle a {
        color: #6b7280;
        text-decoration: none;
        margin: 0 0.25rem;
      }
      .lang-toggle a:hover {
        text-decoration: underline;
      }
      .lang-toggle a.active {
        color: #2563eb;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 data-i18n="title">Se connecter</h1>
      <div id="error" class="error"></div>
      <form id="loginForm">
        <label for="email" data-i18n="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <label for="password" data-i18n="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
        <button type="submit" id="submitBtn" data-i18n="submit">Se connecter</button>
      </form>
      <div id="resendBox" class="resend-box" hidden></div>
      <div class="link">
        <span data-i18n="noAccount">Vous n'avez pas de compte ?</span>
        <a id="registerLink" href="/register" data-i18n="register">S'inscrire</a>
      </div>
      <div class="lang-toggle">
        <a data-lang="fr" href="?lang=fr">Français</a> ·
        <a data-lang="en" href="?lang=en">English</a>
      </div>
    </div>

    <script>
      const ALLOWED_REDIRECT_ORIGINS = __ALLOWED_REDIRECT_ORIGINS__;

      const I18N = {
        fr: {
          title: "Se connecter",
          email: "E-mail",
          password: "Mot de passe",
          submit: "Se connecter",
          noAccount: "Vous n'avez pas de compte ?",
          register: "S'inscrire",
          loginFailed: "Échec de la connexion",
          mfaTitle: "Code à deux facteurs",
          mfaLabel: "Code à 6 chiffres de votre application d'authentification",
          mfaVerify: "Vérifier",
          invalidCode: "Code invalide",
          notVerified: "E-mail non vérifié — vérifiez votre boîte mail.",
          resendPrompt: "Vous n'avez rien reçu ?",
          resend: "Renvoyer l'e-mail",
          resendSent: "E-mail renvoyé — vérifiez votre boîte mail.",
          resendFailed: "Échec de l'envoi, réessayez.",
        },
        en: {
          title: "Sign In",
          email: "Email",
          password: "Password",
          submit: "Sign In",
          noAccount: "Don't have an account?",
          register: "Register",
          loginFailed: "Login failed",
          mfaTitle: "Two-factor code",
          mfaLabel: "6-digit code from your authenticator",
          mfaVerify: "Verify",
          invalidCode: "Invalid code",
          notVerified: "Email not verified — check your inbox.",
          resendPrompt: "Didn't receive it?",
          resend: "Resend email",
          resendSent: "Email resent — check your inbox.",
          resendFailed: "Couldn't resend, try again.",
        },
      };

      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "en" ? "en" : "fr";
      const t = I18N[lang];

      // Localize static content and reflect the active language on <html>.
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key] != null) el.textContent = t[key];
      });
      // Wire the language toggle, preserving the current query params.
      document.querySelectorAll(".lang-toggle a").forEach((a) => {
        const p = new URLSearchParams(window.location.search);
        p.set("lang", a.getAttribute("data-lang"));
        a.href = "?" + p.toString();
        if (a.getAttribute("data-lang") === lang) a.classList.add("active");
      });

      // Loopback (desktop): pass access token in URL.
      // Web SPA keeps cookie flow.
      function isLoopback(origin) {
        try {
          const u = new URL(origin);
          return (
            (u.protocol === "http:" || u.protocol === "https:") &&
            (u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "::1")
          );
        } catch (_) {
          return false;
        }
      }

      function safeRedirect(raw) {
        if (!raw) return "/";
        try {
          const u = new URL(raw, window.location.origin);
          if (u.origin === window.location.origin) return u.href;
          if (ALLOWED_REDIRECT_ORIGINS.includes(u.origin)) return u.href;
          // Allow loopback origin for desktop local callback.
          if (isLoopback(u.origin)) return u.href;
        } catch (_) {}
        return "/";
      }

      // Redirect to redirect_uri.
      // For loopback targets, append access token in query.
      function redirectWithToken(token) {
        if (!token || !isLoopback(redirectUri)) {
          window.location.href = redirectUri;
          return;
        }
        const u = new URL(redirectUri);
        u.searchParams.set("access_token", token);
        window.location.href = u.href;
      }

      const redirectUri = safeRedirect(params.get("redirect_uri"));

      // Keep redirect_uri and lang on register link.
      document.getElementById("registerLink").href =
        "/register?redirect_uri=" + encodeURIComponent(redirectUri) + "&lang=" + lang;

      // Desktop loopback: try silent refresh on load.
      // If refresh cookie is valid, return token without login form.
      if (isLoopback(redirectUri)) {
        (async () => {
          try {
            const csrfRes = await fetch("/auth/csrf", { credentials: "include" });
            const csrfData = await csrfRes.json().catch(() => ({}));
            const csrf = csrfData.csrf_token;
            if (!csrf) return;
            const r = await fetch("/auth/refresh", {
              method: "POST",
              credentials: "include",
              headers: { "X-CSRF-Token": csrf },
            });
            if (!r.ok) return;
            const d = await r.json().catch(() => ({}));
            if (d.access_token) redirectWithToken(d.access_token);
          } catch (_) {
            // Ignore error and show login form.
          }
        })();
      }

      // Wire a "resend verification email" button to the enumeration-safe endpoint.
      // Always 200 on success; 429 when rate-limited (3/60s) — both surface a message,
      // never throw. The button self-disables briefly to blunt accidental double-clicks.
      function attachResend(btn, statusEl, email) {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          statusEl.style.color = "";
          statusEl.textContent = "";
          try {
            const res = await fetch("/auth/resend-verification", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            if (!res.ok) throw new Error();
            statusEl.textContent = t.resendSent;
          } catch (_) {
            statusEl.style.color = "#dc2626";
            statusEl.textContent = t.resendFailed;
          } finally {
            setTimeout(() => {
              btn.disabled = false;
            }, 3000);
          }
        });
      }

      // Shown when login fails because the account's email is still unverified.
      function showResend(email) {
        const boxEl = document.getElementById("resendBox");
        boxEl.innerHTML =
          '<p class="resend-prompt">' +
          t.notVerified +
          " " +
          t.resendPrompt +
          '</p><button type="button" id="resendBtn" class="btn-secondary">' +
          t.resend +
          '</button><div id="resendStatus" class="status"></div>';
        boxEl.hidden = false;
        attachResend(document.getElementById("resendBtn"), document.getElementById("resendStatus"), email);
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("error");
        const btn = document.getElementById("submitBtn");
        errorEl.style.display = "none";
        document.getElementById("resendBox").hidden = true;
        btn.disabled = true;

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 202 && data.mfa_required) {
            showMfaForm(data.mfa_token);
            return;
          }

          // Unverified email is a 403 (as is "banned") — gate on the machine-readable
          // code so only the not-verified case offers a resend fallback.
          if (res.status === 403 && data.code === "email_not_verified") {
            showResend(document.getElementById("email").value);
            btn.disabled = false;
            return;
          }

          if (!res.ok) {
            throw new Error(data.message || t.loginFailed);
          }

          redirectWithToken(data.access_token);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
          btn.disabled = false;
        }
      });

      function showMfaForm(mfaToken) {
        document.querySelector(".card").innerHTML =
          "<h1>" +
          t.mfaTitle +
          "</h1>" +
          '<div id="error" class="error"></div>' +
          '<form id="mfaForm">' +
          '<label for="code">' +
          t.mfaLabel +
          "</label>" +
          '<input type="text" id="code" name="code" required inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="one-time-code">' +
          '<button type="submit" id="mfaBtn">' +
          t.mfaVerify +
          "</button>" +
          "</form>";
        const errEl = document.getElementById("error");
        const btn2 = document.getElementById("mfaBtn");
        document.getElementById("mfaForm").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          errEl.style.display = "none";
          btn2.disabled = true;
          try {
            const r = await fetch("/auth/login/mfa", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ mfa_token: mfaToken, code: document.getElementById("code").value }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) {
              throw new Error(d.message || t.invalidCode);
            }
            redirectWithToken(d.access_token);
          } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = "block";
            btn2.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
