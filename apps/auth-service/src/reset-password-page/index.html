<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialiser le mot de passe</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }
      .hint {
        font-size: 0.8125rem;
        color: #6b7280;
        margin: -0.5rem 0 1rem;
      }
      button {
        width: 100%;
        padding: 0.625rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        display: none;
      }
      .link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .link a {
        color: #2563eb;
        text-decoration: none;
      }
      .link a:hover {
        text-decoration: underline;
      }
      .icon {
        font-size: 2.5rem;
        line-height: 1;
        margin-bottom: 1rem;
        text-align: center;
      }
      .icon.ok {
        color: #059669;
      }
      .icon.bad {
        color: #dc2626;
      }
      .lang-toggle {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        color: #9ca3af;
      }
      .lang-toggle a {
        color: #6b7280;
        text-decoration: none;
        margin: 0 0.25rem;
      }
      .lang-toggle a:hover {
        text-decoration: underline;
      }
      .lang-toggle a.active {
        color: #2563eb;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1 data-i18n="title">Réinitialiser le mot de passe</h1>
      <div id="error" class="error"></div>
      <form id="resetForm">
        <label for="password" data-i18n="newPassword">Nouveau mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="12" />
        <p class="hint" data-i18n="passwordHint">
          Au moins 12 caractères, avec majuscule, minuscule, chiffre et symbole.
        </p>
        <label for="confirm" data-i18n="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirm" name="confirm" required autocomplete="new-password" />
        <button type="submit" id="submitBtn" data-i18n="submit">Réinitialiser</button>
      </form>
      <div class="link">
        <a id="loginLink" href="/login" data-i18n="backToSignIn">Retour à la connexion</a>
      </div>
      <div class="lang-toggle">
        <a data-lang="fr" href="?lang=fr">Français</a> ·
        <a data-lang="en" href="?lang=en">English</a>
      </div>
    </div>

    <script>
      const I18N = {
        fr: {
          title: "Réinitialiser le mot de passe",
          newPassword: "Nouveau mot de passe",
          confirmPassword: "Confirmer le mot de passe",
          passwordHint: "Au moins 12 caractères, avec majuscule, minuscule, chiffre et symbole.",
          submit: "Réinitialiser",
          backToSignIn: "Retour à la connexion",
          missingTitle: "Lien manquant",
          missingBody: "Ce lien de réinitialisation est incomplet. Utilisez le lien reçu par e-mail.",
          weakPassword:
            "Le mot de passe doit contenir au moins 12 caractères, une majuscule, une minuscule, un chiffre et un symbole.",
          mismatch: "Les mots de passe ne correspondent pas.",
          resetFailed: "Échec de la réinitialisation.",
          successTitle: "Mot de passe mis à jour",
          successBody: "Votre mot de passe a été mis à jour. Vous pouvez maintenant vous connecter.",
          goToLogin: "Se connecter",
        },
        en: {
          title: "Reset your password",
          newPassword: "New password",
          confirmPassword: "Confirm password",
          passwordHint: "At least 12 characters, with upper, lower, digit and symbol.",
          submit: "Reset password",
          backToSignIn: "Back to sign in",
          missingTitle: "Missing link",
          missingBody: "This reset link is incomplete. Use the link from your email.",
          weakPassword: "Password must be at least 12 characters with an uppercase, lowercase, digit and symbol.",
          mismatch: "Passwords don't match.",
          resetFailed: "Couldn't reset the password.",
          successTitle: "Password updated",
          successBody: "Your password has been updated. You can now sign in.",
          goToLogin: "Sign in",
        },
      };

      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "en" ? "en" : "fr";
      const t = I18N[lang];
      const token = params.get("token");

      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key] != null) el.textContent = t[key];
      });
      document.querySelectorAll(".lang-toggle a").forEach((a) => {
        const p = new URLSearchParams(window.location.search);
        p.set("lang", a.getAttribute("data-lang"));
        a.href = "?" + p.toString();
        if (a.getAttribute("data-lang") === lang) a.classList.add("active");
      });
      document.getElementById("loginLink").href = "/login?lang=" + lang;

      const card = document.getElementById("card");

      function renderState(cls, title, body) {
        card.innerHTML =
          '<div class="icon ' +
          cls +
          '">' +
          (cls === "ok" ? "✓" : "✕") +
          "</div><h1>" +
          title +
          '</h1><p style="text-align:center">' +
          body +
          '</p><p class="link" style="margin-top:1.5rem"><a href="/login?lang=' +
          lang +
          '"><button type="button">' +
          t.goToLogin +
          "</button></a></p>";
      }

      // Mirror the server's StrongPasswordSchema so the user gets an instant, localized
      // message instead of a raw zod validation error on submit.
      function isStrong(pw) {
        return pw.length >= 12 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw);
      }

      // No token → nothing to reset. Show a terminal state, hide the form.
      if (!token) {
        renderState("bad", t.missingTitle, t.missingBody);
      } else {
        document.getElementById("resetForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById("error");
          const btn = document.getElementById("submitBtn");
          const pw = document.getElementById("password").value;
          const confirm = document.getElementById("confirm").value;
          errorEl.style.display = "none";

          if (!isStrong(pw)) {
            errorEl.textContent = t.weakPassword;
            errorEl.style.display = "block";
            return;
          }
          if (pw !== confirm) {
            errorEl.textContent = t.mismatch;
            errorEl.style.display = "block";
            return;
          }

          btn.disabled = true;
          try {
            const res = await fetch("/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, newPassword: pw }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              throw new Error(data.message || t.resetFailed);
            }
            renderState("ok", t.successTitle, t.successBody);
          } catch (err) {
            errorEl.textContent = err.message || t.resetFailed;
            errorEl.style.display = "block";
            btn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
