# Static host for the built user-front SPA (docker-compose.prod.yml).
# Listens on 8080 so the container can run as the unprivileged `nginx` user
# (ports < 1024 need root). The prod compose maps ${USER_PORT} → 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Declared at the server level (covers `location /`, the SPA
    # fallback) and repeated in the two locations below that set their own add_header —
    # nginx only inherits add_header into a block that declares none of its own.
    # No resource-restricting CSP (default-src/script-src/connect-src): the SPA fetches
    # cross-origin from the api & auth subdomains and loads object-storage images, so a
    # strict CSP needs per-app tuning + browser testing (tracked as a follow-up).
    # frame-ancestors 'none' + X-Frame-Options close the clickjacking hole on the
    # authenticated SPA that the audit flagged.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never cache the entry document — it references the hashed asset bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routing (createBrowserRouter): unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
