# Hôte statique de la SPA user-front compilée (docker-compose.prod.yml).
# Écoute sur 8080 pour que le conteneur tourne en utilisateur non privilégié `nginx`
# (les ports < 1024 exigent root). La compose prod mappe ${USER_PORT} → 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité. Déclarés au niveau server (couvre `location /`, le repli SPA)
    # et répétés dans les deux locations ci-dessous qui posent leur propre add_header —
    # nginx n'hérite des add_header que dans un bloc qui n'en déclare aucun lui-même.
    # Pas de CSP restreignant les ressources (default-src/script-src/connect-src) : la SPA
    # fait des requêtes cross-origin vers les sous-domaines api & auth et charge des images
    # du stockage objet ; une CSP stricte demande donc un réglage par app + des tests
    # navigateur (suivi en tâche de fond). frame-ancestors 'none' + X-Frame-Options ferment
    # la faille de clickjacking sur la SPA authentifiée signalée par l'audit.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ne jamais mettre en cache le document d'entrée — il référence les bundles d'assets hachés.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Vite émet des noms de fichiers hachés par contenu sous /assets — cache permanent sûr.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Routage côté client (createBrowserRouter) : les chemins inconnus retombent sur la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
