# Static host for the built landing page (docker-compose.prod.yml).
# Listens on 8080 so the container can run as the unprivileged `nginx` user
# (ports < 1024 need root). The prod compose maps ${LANDING_PORT} → 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry document — it references the hashed asset bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
